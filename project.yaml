# DSGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.2
  last_upgraded: 2026-11-01

project:
  stage: Technical Setup

modes:
  rigor: standard
  automation: guided

engine:
  name: "Unity"
  version: "2022.3.62f3c1"
  language: "C#"
  # 技能表给 Unity 的默认是 URP，但本工程实测为 Built-in：
  # ProjectSettings/GraphicsSettings.asset 的 m_CustomRenderPipeline = {fileID: 0}，
  # Packages/manifest.json 无 com.unity.render-pipelines.*。按实测值记录。
  rendering: "Built-in (BiRP)"
  physics: "PhysX"
  path: "C:/Program Files/Unity/Hub/Editor/2022.3.62f3c1/Editor/Unity.exe"

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase          # 实测：private 字段无下划线前缀（[SerializeField] private float rtHeight）
  # 已溯源（2026-11-01）：工程内 100% 的 const 都是 PascalCase
  # （Duration / SlotSize / PadX / FrameBudgetMs / CrawlSeconds …），无 SCREAMING_SNAKE 实例。
  # 技能表默认给的 SCREAMING_SNAKE 与本仓库实测不符，按实测值记录。
  constants: PascalCase
  signals: "PascalCase On<Event>"   # 实测：OnKnobChanged / OnDeposit / OnLocked / OnPhaseFlipped
  files: PascalCase
  scenes: PascalCase

commands:
  build: '"C:/Program Files/Unity/Hub/Editor/2022.3.62f3c1/Editor/Unity.exe" -batchmode -quit -projectPath . -buildTarget Win64 -buildWindows64Player Builds/Win64/Threshold.exe'
  test: '"C:/Program Files/Unity/Hub/Editor/2022.3.62f3c1/Editor/Unity.exe" -batchmode -runTests -projectPath . -testPlatform EditMode -testResults test-results/editmode.xml'
  run: 'Builds/Win64/Threshold.exe -screen-width 1280 -screen-height 720 -screen-fullscreen 0'
  smoke: '"C:/Program Files/Unity/Hub/Editor/2022.3.62f3c1/Editor/Unity.exe" -batchmode -quit -projectPath . -logFile -'

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so `/start` asking "what are
# you building?" would stop changing anything. `/start` Phase 3c documents the
# same rule for the file it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.
